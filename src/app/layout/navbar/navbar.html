<header class="navbar">
  <a class="logo" routerLink="/">
    <i class="fa-solid fa-microchip"></i>
    PC MARKET BUILDER
  </a>

  <nav class="links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Catálogo</a>
    @if (auth.isAuthenticated) {
      <a routerLink="/profile" routerLinkActive="active">Mi perfil</a>
    }
    @if (auth.isAdmin) {
      <a routerLink="/admin/publications" routerLinkActive="active" class="admin-link">
        <i class="fa-solid fa-shield-halved"></i> Admin
      </a>
    }
  </nav>

  <div class="session">
    <a class="btn btn-outline" routerLink="/sell/new" routerLinkActive="active">
      <i class="fa-solid fa-plus"></i> Publicar
    </a>

    <a class="cart-button" routerLink="/cart" routerLinkActive="active" aria-label="Carrito">
      <i class="fa-solid fa-cart-shopping"></i>
      @if (cart.count() > 0) {
        <span class="cart-badge">{{ cart.count() }}</span>
      }
    </a>

    @if (auth.isAuthenticated) {
      <span class="user"><i class="fa-solid fa-circle-user"></i> {{ auth.displayName }}</span>
      <button type="button" class="btn btn-primary" (click)="logout()">Cerrar sesión</button>
    } @else {
      <button type="button" class="btn btn-primary" (click)="login()">Iniciar sesión</button>
    }
  </div>
</header>
